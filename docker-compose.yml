# EduWitCode (componentesEMS) en code.eduwitlabs.com.mx — corre en el mismo
# VPS que el resto de EduWitLabs, usando el Traefik ya levantado por
# administrador/docker-compose.yml (no se repite acá: solo se conecta a la
# red externa 'eduwit_edge').
#
# Una sola imagen (frontend + backend FastAPI + arduino-cli), servida por
# nginx en el puerto 80 adentro del contenedor — ver Dockerfile y README.md.
# Necesita HTTPS sí o sí (Web Serial no funciona por HTTP), por eso va
# detrás de Traefik en vez de exponerse directo con -p 80:80.
name: eduwit-code-prod
services:
  app:
    build: .
    container_name: eduwit_code_app
    restart: unless-stopped
    networks:
      - edge
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.eduwit-code-app.rule=Host(`code.eduwitlabs.com.mx`)"
      - "traefik.http.routers.eduwit-code-app.entrypoints=websecure"
      - "traefik.http.routers.eduwit-code-app.tls.certresolver=letsencrypt"
      - "traefik.http.routers.eduwit-code-app.priority=1"
      - "traefik.http.services.eduwit-code-app.loadbalancer.server.port=80"

networks:
  edge:
    external: true
    name: eduwit_edge
